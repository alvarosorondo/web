---
layout: default
seccion: diario
---
<a class="volver" href="{{ '/diario/' | relative_url }}">← Volver al diario</a>
<article class="posteo">
  <div class="fecha">{% include fecha.html fecha=page.date %}</div>
  {% if page.lugar %}<div class="lugar">📍 {{ page.lugar }}</div>{% endif %}
  <h1>{{ page.title }}</h1>
  <div class="texto">{{ content }}</div>
</article>
